[project]
name = "mentis-backend"
version = "0.4.0"
description = "Mentis API and core services"
requires-python = ">=3.12"
# Minimum versions are security floors (pip-audit clean): raise them when an advisory appears.
# Changing this list also makes the Docker build reinstall dependencies (the layer is cached otherwise).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=50",
    "python-multipart>=0.0.31",
    "minio>=7.2",
    "redis>=5",
    "rq>=1.16",
    "httpx>=0.27",
    "qdrant-client>=1.12",
    # Security floors of indirect dependencies (FastAPI, uvicorn, httpx, minio, qdrant-client).
    "starlette>=1.3.1",
    "h11>=0.16",
    "anyio>=4.14.2",
    "urllib3>=2.8",
    "idna>=3.15",
    "certifi>=2026.10.18",
    "protobuf>=6.33.5",
]

[project.optional-dependencies]
# Ingestion worker: parsing and OCR (the Tesseract binary comes from the worker image).
worker = [
    "pdfplumber>=0.11",
    "pdfminer.six>=20251230",  # used by pdfplumber; older versions have advisories
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pytesseract>=0.3.13",
    "pillow>=13",
    "lxml>=6.1",         # used by python-docx and python-pptx
    "defusedxml>=0.7",   # openpyxl uses it to refuse malicious XML (entity expansion)
]
# Optional Docling parser (MENTIS_PARSER=docling). Large: pulls PyTorch.
docling = ["docling>=2.0"]

dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4", "pypdf>=4"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
