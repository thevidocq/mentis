# Proxy to the API, shared by the /api/ locations of nginx.conf.
proxy_pass $api_upstream;
proxy_set_header Host $host;
# The API takes the client IP from the right end of this list, skipping trusted proxies
# (MENTIS_TRUSTED_PROXIES): a value sent by the client itself cannot replace the real address.
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Keep the scheme set by the reverse proxy in front (HTTPS), if any.
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_read_timeout 300s;
