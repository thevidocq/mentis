map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Document uploads (MENTIS_MAX_UPLOAD_MB, 50 MB by default).
    client_max_body_size 100m;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # "mentis-api" is the API's alias on this project's network (docker-compose.yml): unlike
    # "api", it cannot match a service of another stack whose network the web container joins
    # (e.g. equalizer_edge). Resolved through Docker's DNS at request time, not once at start:
    # after `docker compose up -d api` the new container can get another IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://mentis-api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keep the scheme set by the reverse proxy in front (HTTPS), if any.
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 30d;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: every other path serves index.html.
    location / {
        try_files $uri /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
