[project]
name = "mentis-defender"
version = "1.0.0"
description = "Mentis connector: Microsoft Defender for Endpoint (read-only)"
requires-python = ">=3.12"
dependencies = []

[project.entry-points."mentis.connectors"]
defender = "mentis_defender:connector"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mentis_defender*"]
