[project]
name = "mentis-entraid"
version = "1.0.0"
description = "Mentis connector: Microsoft Entra ID (read-only)"
requires-python = ">=3.12"
dependencies = []

[project.entry-points."mentis.connectors"]
entraid = "mentis_entraid:connector"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mentis_entraid*"]
