# Mentis – Docker Compose
# Open the app at http://127.0.0.1:8080 (put your own nginx/HTTPS in front for remote access).

services:
  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:8080"

  api:
    build:
      context: ./backend
      target: api
    restart: unless-stopped
    environment: &backend-env
      MENTIS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MENTIS_SECRET_KEY: ${MENTIS_SECRET_KEY}
      MENTIS_COOKIE_SECURE: ${MENTIS_COOKIE_SECURE:-true}
      MENTIS_TRUSTED_PROXIES: ${MENTIS_TRUSTED_PROXIES:-*}
      MENTIS_PUBLIC_URL: ${MENTIS_PUBLIC_URL:-http://localhost}
      MENTIS_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MENTIS_MINIO_ENDPOINT: minio:9000
      MENTIS_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MENTIS_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MENTIS_MAX_UPLOAD_MB: ${MENTIS_MAX_UPLOAD_MB:-50}
      MENTIS_QDRANT_URL: http://qdrant:6333
      MENTIS_QDRANT_API_KEY: ${QDRANT_API_KEY}
      MENTIS_EMBEDDING_URL: ${MENTIS_EMBEDDING_URL:-http://embeddings/v1}
      MENTIS_EMBEDDING_MODEL: ${MENTIS_EMBEDDING_MODEL:-BAAI/bge-m3}
      MENTIS_CHAT_PASSAGES: ${MENTIS_CHAT_PASSAGES:-8}
      MENTIS_CHAT_MIN_SCORE: ${MENTIS_CHAT_MIN_SCORE:-0.3}
    # Lets AI providers reach a model server on the host (e.g. Ollama at http://host.docker.internal:11434/v1).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      qdrant:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: ./backend
      target: worker
      args:
        PARSER_EXTRAS: ${MENTIS_PARSER_EXTRAS:-worker}
    restart: unless-stopped
    environment:
      <<: *backend-env
      MENTIS_PARSER: ${MENTIS_PARSER:-standard}
    depends_on:
      api:
        condition: service_healthy
    # Parsing and OCR are CPU/RAM heavy: keep them from starving the API.
    # More workers process more documents in parallel (limits apply to each one).
    deploy:
      replicas: ${MENTIS_WORKER_REPLICAS:-1}
      resources:
        limits:
          cpus: "${MENTIS_WORKER_CPUS:-2}"
          memory: ${MENTIS_WORKER_MEMORY:-3g}

  # Local embeddings: Hugging Face Text Embeddings Inference (CPU) with bge-m3.
  # The model (~2.3 GB) is downloaded on first start into the embeddings-data volume.
  # To use another OpenAI-compatible service instead (Ollama, vLLM), set MENTIS_EMBEDDING_URL
  # and stop this one; the model can also be changed later in Embedding and Qdrant.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    restart: unless-stopped
    command: ["--model-id", "${MENTIS_EMBEDDING_MODEL:-BAAI/bge-m3}", "--port", "80"]
    volumes:
      - embeddings-data:/data
    deploy:
      resources:
        limits:
          cpus: "${MENTIS_EMBEDDINGS_CPUS:-2}"
          memory: ${MENTIS_EMBEDDINGS_MEMORY:-4g}

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  embeddings-data:
  postgres-data:
  qdrant-data:
  minio-data:
  redis-data:
